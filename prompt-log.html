<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Log</title>
<style>
:root{
  --bg:#0b0b0e;
  --bg-elev:#141419;
  --bg-elev-2:#1b1c22;
  --border:#2a2b33;
  --text:#f2f0ea;
  --text-dim:#a8a6b0;
  --text-faint:#6e6c78;
  --accent:#e0b15c;
  --accent-soft:rgba(224,177,92,0.14);
  --accent-text:#1a1408;
  --danger:#e2685f;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,0.35);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
:root[data-theme="light"]{
  --bg:#f7f5f0;
  --bg-elev:#ffffff;
  --bg-elev-2:#f0eee7;
  --border:#e2ded3;
  --text:#211f1a;
  --text-dim:#6b6860;
  --text-faint:#a19d90;
  --accent:#b5822a;
  --accent-soft:rgba(181,130,42,0.12);
  --accent-text:#fffaf0;
  --shadow:0 10px 30px rgba(30,20,0,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  transition:background .2s ease,color .2s ease;
}
::selection{background:var(--accent-soft);color:var(--text);}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
a{color:inherit;}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:40;}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg),var(--bg) 80%,transparent);
  padding:22px 28px 14px;
  display:flex;flex-direction:column;gap:14px;
}
.header-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;}
.brand h1{
  font-size:21px;margin:0;font-weight:700;letter-spacing:0.2px;
}
.brand .dot{color:var(--accent);}
.folder-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--bg-elev);border:1px solid var(--border);
  padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--text-dim);
}
.folder-chip strong{color:var(--text);font-weight:600;}
.btn{
  border:1px solid var(--border);background:var(--bg-elev);color:var(--text);
  padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600;}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-text);}
.btn.icon{padding:9px 10px;}
.btn.small{padding:6px 11px;font-size:12.5px;}
.btn.danger:hover{border-color:var(--danger);color:var(--danger);}

.search-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.search-box{
  position:relative;flex:1;min-width:220px;max-width:420px;
}
.search-box input{
  width:100%;padding:10px 14px 10px 36px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg-elev);color:var(--text);
  font-size:13.5px;outline:none;
}
.search-box input:focus{border-color:var(--accent);}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:0.5;}
select.sortsel{
  padding:9px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-elev);color:var(--text);font-size:13px;outline:none;
}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chip{
  flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg-elev);color:var(--text-dim);font-size:12.5px;white-space:nowrap;
  transition:all .15s ease;
}
.chip:hover{color:var(--text);}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.chip .cnt{opacity:0.55;margin-left:4px;}

/* ---------- gallery ---------- */
main{padding:8px 28px 60px;}
.masonry{columns:250px 5;column-gap:16px;}
.card{
  break-inside:avoid;margin-bottom:16px;border-radius:var(--radius);
  overflow:hidden;background:var(--bg-elev);border:1px solid var(--border);
  cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  position:relative;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent);}
.card .thumb-wrap{position:relative;width:100%;background:var(--bg-elev-2);}
.card img.thumb{width:100%;display:block;object-fit:cover;}
.badge-type{
  position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.55);color:#fff;
  font-size:10.5px;padding:3px 7px;border-radius:6px;display:flex;align-items:center;gap:4px;
  backdrop-filter:blur(2px);
}
.badge-need{
  position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;
  font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;
}
.fav-btn{
  position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.5);border:none;
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;opacity:0;transition:opacity .15s ease;
}
.card:hover .fav-btn{opacity:1;}
.fav-btn.is-fav{opacity:1;color:var(--accent);}
.card-body{padding:12px 13px 13px;}
.card-prompt{
  font-size:13px;line-height:1.5;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  min-height:1.5em;
}
.card-prompt.empty{color:var(--text-faint);font-style:italic;}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.tool-tag{
  font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  padding:3px 8px;border-radius:6px;
}
.date-tag{font-size:11px;color:var(--text-faint);margin-left:auto;}
.tag-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.tag-pill{font-size:10.5px;color:var(--text-dim);background:var(--bg-elev-2);padding:2px 7px;border-radius:5px;}

.empty-state{
  text-align:center;padding:100px 20px;color:var(--text-faint);
}
.empty-state h2{color:var(--text-dim);font-size:18px;margin-bottom:8px;}
.dropzone{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.7);
  display:none;align-items:center;justify-content:center;
  border:3px dashed var(--accent);
}
.dropzone.active{display:flex;}
.dropzone span{font-size:22px;font-weight:700;color:var(--accent);}

/* ---------- modal ---------- */
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(920px,92vw);max-height:88vh;background:var(--bg-elev);
  border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
  z-index:41;display:flex;overflow:hidden;
}
.modal .media-pane{
  flex:1.1;background:#000;display:flex;align-items:center;justify-content:center;min-width:0;
}
.modal .media-pane img,.modal .media-pane video{max-width:100%;max-height:88vh;object-fit:contain;}
.modal .form-pane{
  flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-width:320px;
}
.modal .form-pane h3{margin:0 0 2px;font-size:15px;color:var(--text-dim);font-weight:600;}
.field label{display:block;font-size:12px;color:var(--text-faint);margin-bottom:6px;font-weight:600;letter-spacing:0.2px;text-transform:uppercase;}
.field textarea,.field input{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-elev-2);color:var(--text);font-size:13.5px;outline:none;resize:vertical;
}
.field textarea:focus,.field input:focus{border-color:var(--accent);}
.field textarea{min-height:110px;line-height:1.5;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}
.modal-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--border);}
.modal-close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,0.4);border:none;color:#fff;display:flex;align-items:center;justify-content:center;z-index:2;
}
.filename-note{font-size:11px;color:var(--text-faint);}
.param-box{border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:var(--bg-elev-2);}
.param-head{font-size:10.5px;text-transform:uppercase;letter-spacing:0.3px;color:var(--text-faint);font-weight:700;margin-bottom:7px;}
.param-list{display:flex;flex-wrap:wrap;gap:5px;}
.param-chip{font-size:11px;color:var(--text-dim);background:var(--bg-elev);border:1px solid var(--border);padding:2px 7px;border-radius:5px;}
.param-chip b{color:var(--text-faint);font-weight:600;margin-right:3px;}
.badge-auto{
  position:absolute;top:8px;right:8px;background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--accent);font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;
  backdrop-filter:blur(2px);
}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);
  padding:11px 20px;border-radius:10px;font-size:13px;z-index:60;box-shadow:var(--shadow);
  opacity:0;transition:opacity .2s ease;pointer-events:none;
}
.toast.show{opacity:1;}
.gate{
  min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;
}
.gate h2{font-size:24px;margin:0;}
.gate p{color:var(--text-dim);font-size:14px;max-width:420px;margin:0;}
.spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (max-width:640px){
  header{padding:16px 16px 10px;} main{padding:8px 16px 60px;}
  .modal{flex-direction:column;width:94vw;max-height:92vh;}
  .modal .media-pane{max-height:38vh;}
}
</style>
</head>
<body>

<div id="gateView" class="gate" style="display:none;">
  <h2>Prompt Log</h2>
  <p>이미지·영상 생성 결과와 그걸 만든 프롬프트를 한곳에 모아두는 독립 로컬 갤러리입니다.<br>결과물을 저장할 폴더를 선택해주세요 (기존 출력 폴더도 가능).</p>
  <button class="btn primary" id="pickFolderBtn">📁 폴더 선택하기</button>
</div>

<div id="reconnectView" class="gate" style="display:none;">
  <h2>다시 연결이 필요해요</h2>
  <p id="reconnectFolderName" style="color:var(--accent);font-weight:600;"></p>
  <button class="btn primary" id="reconnectBtn">🔓 폴더 접근 허용</button>
  <button class="btn small" id="reconnectPickOther">다른 폴더 선택</button>
</div>

<div id="fatalView" class="gate" style="display:none;">
  <h2 style="color:var(--danger);">메타데이터를 읽을 수 없어요</h2>
  <p id="fatalDetail"></p>
  <p style="font-size:12.5px;">데이터를 덮어쓰지 않기 위해 여기서 멈췄습니다. 파일을 고친 뒤 새로고침해주세요.</p>
  <button class="btn small" id="fatalPickOther">다른 폴더 선택</button>
</div>

<div id="appView" style="display:none;">
<header>
  <div class="header-top">
    <div class="brand"><h1>Prompt Log<span class="dot">.</span></h1></div>
    <div class="folder-chip">📁 <strong id="folderName"></strong></div>
    <button class="btn small" id="rescanBtn" title="폴더에 새로 생긴 파일 읽기">↻ 새로고침</button>
    <button class="btn small" id="backfillBtn" title="비어 있는 항목에서 PNG에 박힌 프롬프트 다시 추출">✨ 자동 추출</button>
    <button class="btn small" id="switchFolderBtn">폴더 변경</button>
    <button class="btn icon small" id="themeBtn" title="테마 전환">🌙</button>
    <button class="btn small" id="exportBtn">⤓ 내보내기</button>
    <button class="btn primary" id="addBtn">＋ 새 항목</button>
  </div>
  <div class="search-row">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="프롬프트, 태그, 툴 검색... ( / )">
    </div>
    <select class="sortsel" id="sortSel">
      <option value="new">최신순</option>
      <option value="old">오래된순</option>
      <option value="fav">즐겨찾기 우선</option>
    </select>
    <span style="font-size:12px;color:var(--text-faint);margin-left:4px;" id="countLabel"></span>
  </div>
  <div class="chipbar" id="toolChipBar"></div>
  <div class="chipbar" id="tagChipBar"></div>
</header>
<main>
  <div class="masonry" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <h2>아직 항목이 없어요</h2>
    <p>이미지나 영상을 화면에 드래그하거나 "새 항목" 버튼으로 추가해보세요.</p>
  </div>
</main>
</div>

<div class="dropzone" id="dropzone"><span>여기에 놓아서 추가하기</span></div>
<div class="toast" id="toast"></div>

<template id="modalTpl">
  <div class="scrim"></div>
  <div class="modal">
    <button class="modal-close" data-close>✕</button>
    <div class="media-pane"></div>
    <div class="form-pane">
      <h3>항목 정보</h3>
      <div class="field"><label>프롬프트</label><textarea data-f="prompt" placeholder="이 결과물을 만든 프롬프트를 입력하세요"></textarea></div>
      <div class="field"><label>네거티브 프롬프트</label><textarea data-f="negative" style="min-height:52px;" placeholder="선택"></textarea></div>
      <div class="row2">
        <div class="field"><label>툴</label><input list="toolList" data-f="tool" placeholder="예: ComfyUI, Seedance, Midjourney"></div>
        <div class="field"><label>시드</label><input data-f="seed" placeholder="선택"></div>
      </div>
      <div class="field"><label>모델 / 체크포인트</label><input data-f="model" placeholder="선택"></div>
      <div class="field"><label>태그 (쉼표로 구분)</label><input data-f="tagsRaw" placeholder="예: 인물, 실사, 야간"></div>
      <div class="field"><label>메모</label><textarea data-f="notes" style="min-height:60px;" placeholder="선택"></textarea></div>
      <div data-params></div>
      <div class="filename-note" data-fn></div>
      <div class="modal-actions">
        <button class="btn primary" data-save>저장</button>
        <button class="btn icon" data-copy title="프롬프트 복사">⧉</button>
        <button class="btn icon" data-fav title="즐겨찾기">☆</button>
        <span style="flex:1;"></span>
        <button class="btn danger" data-delete>삭제</button>
      </div>
    </div>
  </div>
</template>
<datalist id="toolList"></datalist>

<script>
(function(){
"use strict";

let rootHandle = null;
let db = {version:1, entries:[]};
let state = {search:"", tool:null, tag:null, sort:"new", needOnly:false};
let modalUrls = [];   // object URLs owned by the open modal; revoked on close

/* ---------- idb for handle persistence ---------- */
function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("promptlog-store", 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("kv");
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbSet(key,val){
  const d = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = d.transaction("kv","readwrite");
    tx.objectStore("kv").put(val,key);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(key){
  const d = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = d.transaction("kv","readonly");
    const rq = tx.objectStore("kv").get(key);
    rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>rej(rq.error);
  });
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function show(id){ ["gateView","reconnectView","fatalView","appView"].forEach(v=>{document.getElementById(v).style.display = v===id?"":"none";}); }

/* ---------- boot ---------- */
async function boot(){
  applyTheme(localStorage.getItem("pl-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light":"dark"));
  if (!("showDirectoryPicker" in window)){
    document.getElementById("gateView").querySelector("p").textContent = "이 기능은 Chrome 또는 Edge 브라우저에서만 사용할 수 있어요.";
    show("gateView");
    return;
  }
  const saved = await idbGet("rootDir").catch(()=>null);
  if (saved){
    rootHandle = saved;
    const perm = await rootHandle.queryPermission({mode:"readwrite"});
    if (perm === "granted"){
      await openLibrary();
    } else {
      document.getElementById("reconnectFolderName").textContent = "📁 " + rootHandle.name;
      show("reconnectView");
    }
  } else {
    show("gateView");
  }
}

document.getElementById("pickFolderBtn").onclick = pickFolder;
document.getElementById("reconnectPickOther").onclick = pickFolder;
document.getElementById("fatalPickOther").onclick = pickFolder;
document.getElementById("switchFolderBtn").onclick = pickFolder;
document.getElementById("reconnectBtn").onclick = async ()=>{
  const perm = await rootHandle.requestPermission({mode:"readwrite"});
  if (perm === "granted") await openLibrary();
  else toast("접근이 거부되었어요.");
};

async function pickFolder(){
  try{
    const handle = await window.showDirectoryPicker({mode:"readwrite"});
    rootHandle = handle;
    await idbSet("rootDir", handle);
    await openLibrary();
  }catch(e){ if (e.name !== "AbortError") console.error(e); }
}

async function openLibrary(){
  document.getElementById("folderName").textContent = rootHandle.name;
  show("appView");
  if (!await loadMeta()) return;   // corrupt metadata: stop before touching anything
  await scanOrphans();
  render();
}

/* ---------- metadata io ---------- */
const META_FILE = "metadata.json";
const TMP_FILE  = "metadata.json.tmp";
const BAK_FILE  = "metadata.backup.json";

/* A parse failure must never destroy the file. We quarantine it under a dated
   name, hand the user the filename, and refuse to run rather than start empty. */
async function loadMeta(){
  let text = null;
  try{
    const fh = await rootHandle.getFileHandle(META_FILE);
    text = await (await fh.getFile()).text();
  }catch(e){
    db = {version:1, entries:[]};        // genuinely absent: first run
    await saveMeta();
    return true;
  }
  if (!text.trim()){ db = {version:1, entries:[]}; return true; }
  try{
    const parsed = JSON.parse(text);
    if (!parsed || !Array.isArray(parsed.entries)) throw new Error("shape");
    db = parsed;
  }catch(e){
    const stamp = new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
    const quarantine = `metadata.corrupt-${stamp}.json`;
    try{
      const q = await rootHandle.getFileHandle(quarantine, {create:true});
      const w = await q.createWritable();
      await w.write(text); await w.close();
    }catch(err){ console.error("quarantine failed", err); }
    showFatal(quarantine);
    return false;
  }
  await writeBackupOnce(text);
  return true;
}

/* One snapshot of the last known-good file per session — cheap insurance
   that costs a single write instead of doubling every save. */
let backupDone = false;
async function writeBackupOnce(text){
  if (backupDone || !text) return;
  backupDone = true;
  try{
    const fh = await rootHandle.getFileHandle(BAK_FILE, {create:true});
    const w = await fh.createWritable();
    await w.write(text); await w.close();
  }catch(e){ console.warn("backup failed", e); }
}

/* Saves are fired from many handlers; serialise them so two writers can never
   interleave into the same file, and stage through a temp file so a crash
   mid-write leaves the previous metadata.json intact. */
let saveChain = Promise.resolve();
function saveMeta(){
  saveChain = saveChain.then(doSaveMeta, doSaveMeta);
  return saveChain;
}
async function doSaveMeta(){
  const payload = JSON.stringify(db, null, 2);
  try{
    const tmp = await rootHandle.getFileHandle(TMP_FILE, {create:true});
    const w = await tmp.createWritable();
    await w.write(payload);
    await w.close();
    if (typeof tmp.move === "function"){
      await tmp.move(META_FILE);            // atomic swap where supported
      return;
    }
    const fh = await rootHandle.getFileHandle(META_FILE, {create:true});
    const w2 = await fh.createWritable();
    await w2.write(payload);
    await w2.close();
    try{ await rootHandle.removeEntry(TMP_FILE); }catch(e){}
  }catch(e){
    console.error("save failed", e);
    toast("저장에 실패했어요. 폴더 권한을 확인해주세요.");
    throw e;
  }
}

const MEDIA_RE = /\.(png|jpe?g|webp|gif|bmp|avif|mp4|webm|mov|m4v)$/i;
const VIDEO_RE = /\.(mp4|webm|mov|m4v)$/i;

/* =======================================================================
   Embedded generation metadata
   ComfyUI writes the full API graph into a PNG tEXt chunk named "prompt"
   (and the editor graph into "workflow"); A1111 writes a flat text blob
   into "parameters". Both mean the prompt never has to be typed by hand.
   ======================================================================= */

const PNG_SIG = [0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A];

/* Chunks live before IDAT, but a workflow blob can be hundreds of KB, so the
   buffer is grown on demand instead of reading the whole (possibly 4K) file. */
async function readPngTextChunks(file){
  let need = Math.min(file.size, 1 << 16);
  let buf = new Uint8Array(await file.slice(0, need).arrayBuffer());
  if (buf.length < 8 || PNG_SIG.some((b,i)=> buf[i] !== b)) return null;

  const grow = async (upto)=>{
    if (need >= file.size) return false;
    need = Math.min(file.size, Math.max(need * 2, upto));
    buf = new Uint8Array(await file.slice(0, need).arrayBuffer());
    return true;
  };
  const dec = new TextDecoder("utf-8");
  const out = {};
  let i = 8;
  while (true){
    if (i + 8 > buf.length && !await grow(i + 8)) break;
    if (i + 8 > buf.length) break;
    const dv = new DataView(buf.buffer, buf.byteOffset);
    const len = dv.getUint32(i);
    const type = String.fromCharCode(buf[i+4], buf[i+5], buf[i+6], buf[i+7]);
    if (type === "IDAT" || type === "IEND") break;
    if (len > 64 * 1024 * 1024) break;                       // refuse absurd chunks
    if (i + 12 + len > buf.length && !await grow(i + 12 + len)) break;
    if (i + 12 + len > buf.length) break;

    if (type === "tEXt" || type === "iTXt"){
      const body = buf.subarray(i + 8, i + 8 + len);
      let z = body.indexOf(0);
      if (z > 0){
        const key = dec.decode(body.subarray(0, z));
        let valStart = z + 1;
        if (type === "iTXt"){
          const compressed = body[valStart] === 1;
          valStart += 2;                                      // compression flag + method
          const langEnd = body.indexOf(0, valStart);           // language tag
          const trEnd = langEnd < 0 ? -1 : body.indexOf(0, langEnd + 1);   // translated keyword
          if (compressed || langEnd < 0 || trEnd < 0){ i += 12 + len; continue; }
          valStart = trEnd + 1;
        }
        out[key] = dec.decode(body.subarray(valStart));
      }
    }
    i += 12 + len;
  }
  return out;
}

/* Ordered by trustworthiness: a populated wildcard beats its raw template. */
const TEXT_KEYS = ["populated_text","text","text_g","prompt","positive","string","wildcard_text","value"];
const SKIP_TEXT_CLASSES = ["showanything","addlabel","note","previewany","markdownnote","display","showtext","debugprint"];

/* Walk back from a conditioning link until a node exposes literal text. */
function resolveText(graph, ref, depth, seen){
  depth = depth || 0; seen = seen || new Set();
  if (depth > 12 || !Array.isArray(ref) || !ref.length) return "";
  const nid = String(ref[0]);
  if (seen.has(nid)) return "";
  seen.add(nid);
  const node = graph[nid];
  if (!node) return "";
  if (String(node.class_type || "").indexOf("ConditioningZeroOut") >= 0) return "";
  const ins = node.inputs || {};
  for (const k of TEXT_KEYS){
    const v = ins[k];
    if (typeof v === "string" && v.trim()) return v.trim();
  }
  // No literal here: gather upstream. Joining rather than first-wins keeps
  // StringConcatenate-style prompt assembly intact.
  const parts = [];
  for (const k in ins){
    const v = ins[k];
    if (Array.isArray(v) && v.length === 2){
      const got = resolveText(graph, v, depth + 1, seen);
      if (got) parts.push(got);
    }
  }
  return parts.join(" ").trim();
}

/* Follow a numeric link (seed fed by e.g. a Seed (rgthree) node) to its literal. */
function resolveScalar(graph, ref, want, depth){
  depth = depth || 0;
  if (depth > 6 || !Array.isArray(ref) || !ref.length) return null;
  const node = graph[String(ref[0])];
  if (!node) return null;
  const ins = node.inputs || {};
  for (const k of [want, "seed", "noise_seed", "value", "int", "number"]){
    const v = ins[k];
    if (typeof v === "number" || (typeof v === "string" && v.trim())) return v;
    if (Array.isArray(v)){
      const got = resolveScalar(graph, v, want, depth + 1);
      if (got !== null && got !== undefined) return got;
    }
  }
  return null;
}

/* Rank every plausible sampler; prefer the ones carrying real conditioning. */
function pickSampler(graph){
  let best = null;
  for (const nid in graph){
    const n = graph[nid], ins = n.inputs || {};
    const hasCond = ("positive" in ins) || ("guider" in ins);
    const hasSeed = ("seed" in ins) || ("noise_seed" in ins) || ("noise" in ins);
    if (!hasCond && !(hasSeed && ("steps" in ins))) continue;
    const score = 2*("positive" in ins) + 2*("guider" in ins) + ("steps" in ins) + ("cfg" in ins)
                + (String(n.class_type||"").indexOf("KSampler") === 0 ? 1 : 0);
    if (!best || score > best.score) best = {score, node:n};
  }
  return best ? best.node : null;
}

/* No usable sampler chain: fall back to the longest literal prompt string. */
function fallbackText(graph){
  let best = "";
  for (const nid in graph){
    const n = graph[nid];
    const ct = String(n.class_type || "").toLowerCase();
    if (SKIP_TEXT_CLASSES.some(s => ct.indexOf(s) >= 0)) continue;
    const ins = n.inputs || {};
    for (const k of TEXT_KEYS){
      const v = ins[k];
      if (typeof v === "string" && v.trim().length > 8 && v.length > best.length) best = v.trim();
    }
  }
  return best;
}

function extractFromComfyGraph(graph){
  const out = {params:{}};
  const node = pickSampler(graph);
  if (node){
    const ins = node.inputs || {};
    out.prompt   = resolveText(graph, ins.positive || ins.guider);
    out.negative = resolveText(graph, ins.negative);
    const map = {seed:"seed", noise_seed:"seed", steps:"steps", cfg:"cfg",
                 sampler_name:"sampler", scheduler:"scheduler", denoise:"denoise"};
    for (const src in map){
      let v = ins[src];
      if (Array.isArray(v)) v = resolveScalar(graph, v, src);
      const dst = map[src];
      if ((typeof v === "number" || (typeof v === "string" && v !== "")) && out.params[dst] == null){
        out.params[dst] = v;
      }
    }
  }
  if (!out.prompt) out.prompt = fallbackText(graph);
  // A negative identical to the positive means the chain ran through a no-op
  // branch (ConditioningZeroOut and friends), not that it was typed twice.
  if (out.negative && out.negative === out.prompt) out.negative = "";

  // ckpt/unet name the actual model; model_name is usually an upscaler.
  const modelRank = ["ckpt_name","unet_name","model_name","model"];
  const models = {}; const loras = [];
  let width = null, height = null;
  for (const nid in graph){
    const ins = graph[nid].inputs || {};
    modelRank.forEach((k, rank)=>{
      const v = ins[k];
      if (typeof v === "string" && v.trim() && models[rank] == null) models[rank] = v;
    });
    if (typeof ins.lora_name === "string" && ins.lora_name.trim()){
      const st = ins.strength_model != null ? ins.strength_model : ins.strength;
      loras.push(typeof st === "number" ? `${ins.lora_name} (${st})` : ins.lora_name);
    }
    if (width == null && typeof ins.width === "number" && typeof ins.height === "number"){
      width = ins.width; height = ins.height;
    }
  }
  for (let r = 0; r < modelRank.length; r++){ if (models[r]){ out.model = models[r]; break; } }
  if (loras.length) out.params.loras = loras;
  if (width) out.params.size = `${width}×${height}`;
  return out;
}

/* A1111 / Forge: "positive\nNegative prompt: ...\nSteps: 20, Sampler: ..., Seed: 1" */
function parseA1111(text){
  const out = {params:{}};
  const lines = text.split("\n");
  let cut = lines.findIndex(l => /^Steps:\s/.test(l.trim()));
  if (cut < 0) cut = lines.length;
  const head = lines.slice(0, cut).join("\n");
  const negAt = head.indexOf("Negative prompt:");
  out.prompt = (negAt >= 0 ? head.slice(0, negAt) : head).trim();
  out.negative = negAt >= 0 ? head.slice(negAt + 16).trim() : "";
  const tail = lines.slice(cut).join(", ");
  const grab = (re)=>{ const m = tail.match(re); return m ? m[1].trim() : null; };
  const map = {seed:/Seed:\s*([^,]+)/, steps:/Steps:\s*([^,]+)/, cfg:/CFG scale:\s*([^,]+)/,
               sampler:/Sampler:\s*([^,]+)/, size:/Size:\s*([^,]+)/};
  for (const k in map){ const v = grab(map[k]); if (v) out.params[k] = v; }
  const model = grab(/Model:\s*([^,]+)/);
  if (model) out.model = model;
  return out;
}

/* Returns {prompt, negative, tool, model, params} or null when nothing is embedded. */
async function extractEmbedded(file, name){
  if (!/\.png$/i.test(name)) return null;     // only PNG carries this today
  let chunks = null;
  try{ chunks = await readPngTextChunks(file); }catch(e){ return null; }
  if (!chunks) return null;
  if (chunks.prompt){
    try{
      const got = extractFromComfyGraph(JSON.parse(chunks.prompt));
      got.tool = "ComfyUI";
      if (chunks.workflow) got.hasWorkflow = true;
      return got;
    }catch(e){ /* not a ComfyUI graph; fall through */ }
  }
  if (chunks.parameters){
    const got = parseA1111(chunks.parameters);
    got.tool = "A1111";
    return got;
  }
  return null;
}

/* Fills only blanks, so a hand-written note is never overwritten by a re-scan. */
function applyEmbedded(entry, meta){
  if (!meta) return false;
  let touched = false;
  const set = (k, v)=>{ if (v && !entry[k]){ entry[k] = v; touched = true; } };
  set("prompt", meta.prompt);
  set("negative", meta.negative);
  set("tool", meta.tool);
  set("model", meta.model);
  if (meta.params && meta.params.seed != null && !entry.seed){
    entry.seed = String(meta.params.seed); touched = true;
  }
  if (meta.params && Object.keys(meta.params).length && !entry.params){
    entry.params = meta.params; touched = true;
  }
  if (touched){ entry.autoMeta = true; entry.needInfo = !entry.prompt; }
  return touched;
}

const OWN_FILE_RE = /^metadata(\.json(\.tmp)?|\.backup\.json|\.corrupt-.*\.json)$/i;

async function scanOrphans(opts){
  opts = opts || {};
  const known = new Set(db.entries.map(e=>e.filename));
  const found = [];
  for await (const [name, handle] of rootHandle.entries()){
    if (handle.kind === "file" && MEDIA_RE.test(name) && !OWN_FILE_RE.test(name) && !known.has(name)){
      found.push(name);
    }
  }
  if (!found.length){
    if (opts.manual) toast("새로 추가된 파일이 없어요.");
    return 0;
  }
  if (opts.manual) toast(`${found.length}개를 읽는 중...`);
  let auto = 0;
  for (const name of found){
    const fh = await rootHandle.getFileHandle(name);
    const file = await fh.getFile();
    const type = VIDEO_RE.test(name) ? "video" : "image";
    let thumb = "";
    try{ thumb = await makeThumb(file, type); }catch(e){}
    const entry = {
      id: crypto.randomUUID(), filename:name, type, prompt:"", negative:"", tool:"", tags:[],
      seed:"", model:"", notes:"", favorite:false, needInfo:true, thumb,
      createdAt: new Date(file.lastModified || Date.now()).toISOString()
    };
    try{
      if (applyEmbedded(entry, await extractEmbedded(file, name))) auto++;
    }catch(e){ console.warn("meta extract failed", name, e); }
    db.entries.unshift(entry);
  }
  await saveMeta();
  toast(auto
    ? `새 파일 ${found.length}개 · 그중 ${auto}개는 프롬프트를 자동으로 읽었어요.`
    : `새 파일 ${found.length}개를 찾았어요. 정보를 채워주세요.`);
  return found.length;
}

/* Re-reads embedded metadata for entries that are still blank — for a library
   that was imported before extraction existed. */
async function backfillMeta(){
  const targets = db.entries.filter(e => !e.autoMeta && !e.prompt && /\.png$/i.test(e.filename));
  if (!targets.length){ toast("자동 추출할 항목이 없어요."); return; }
  toast(`${targets.length}개를 다시 읽는 중...`);
  let filled = 0;
  for (const e of targets){
    try{
      const file = await (await rootHandle.getFileHandle(e.filename)).getFile();
      if (applyEmbedded(e, await extractEmbedded(file, e.filename))) filled++;
    }catch(err){ /* file gone or unreadable: leave the entry alone */ }
  }
  await saveMeta();
  render();
  toast(`${filled}개에서 프롬프트를 찾았어요.`);
}

/* ---------- thumbnails ---------- */
async function makeThumb(file, type){
  const targetW = 420;
  if (type === "image"){
    const bmp = await createImageBitmap(file, {resizeWidth: targetW, resizeQuality:"high"});
    const canvas = document.createElement("canvas");
    canvas.width = bmp.width; canvas.height = bmp.height;
    canvas.getContext("2d").drawImage(bmp,0,0);
    return canvas.toDataURL("image/jpeg", 0.78);
  } else {
    const url = URL.createObjectURL(file);
    try{
      const video = document.createElement("video");
      video.src = url; video.muted = true; video.playsInline = true;
      await new Promise((res,rej)=>{
        video.onloadeddata = ()=>{ video.currentTime = Math.min(0.3, (video.duration||1)/4); };
        video.onseeked = res; video.onerror = rej;
        setTimeout(rej, 8000);
      });
      const ratio = video.videoHeight / video.videoWidth || 0.6;
      const canvas = document.createElement("canvas");
      canvas.width = targetW; canvas.height = Math.round(targetW*ratio);
      canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
      return canvas.toDataURL("image/jpeg", 0.75);
    } finally { URL.revokeObjectURL(url); }
  }
}

/* ---------- adding files ---------- */
async function uniqueName(name){
  let candidate = name, i = 1;
  const dot = name.lastIndexOf(".");
  const base = dot>0 ? name.slice(0,dot) : name;
  const ext = dot>0 ? name.slice(dot) : "";
  while (true){
    try{ await rootHandle.getFileHandle(candidate); candidate = `${base}-${i++}${ext}`; }
    catch(e){ return candidate; }
  }
}

async function addFiles(fileList){
  const files = Array.from(fileList).filter(f => MEDIA_RE.test(f.name));
  if (!files.length){ toast("이미지/영상 파일만 추가할 수 있어요."); return; }
  const queue = [];
  let autoFilled = 0;
  for (const file of files){
    const name = await uniqueName(file.name.normalize());
    const fh = await rootHandle.getFileHandle(name, {create:true});
    const w = await fh.createWritable();
    await w.write(file);
    await w.close();
    const type = VIDEO_RE.test(name) ? "video" : "image";
    let thumb = "";
    try{ thumb = await makeThumb(file, type); }catch(e){}
    const entry = {
      id: crypto.randomUUID(), filename:name, type, prompt:"", negative:"", tool:"",
      tags:[], seed:"", model:"", notes:"", favorite:false, needInfo:false, thumb,
      createdAt: new Date().toISOString()
    };
    try{
      if (applyEmbedded(entry, await extractEmbedded(file, name))) autoFilled++;
    }catch(e){ console.warn("meta extract failed", name, e); }
    if (!entry.tool) entry.tool = lastTool || "";   // embedded tool wins over the sticky one
    entry.needInfo = !entry.prompt;
    db.entries.unshift(entry);
    queue.push(entry);
  }
  await saveMeta();
  render();
  toast(autoFilled
    ? `${files.length}개 추가 · ${autoFilled}개는 프롬프트를 자동으로 읽었어요.`
    : `${files.length}개 파일을 추가했어요.`);
  // Everything already filled in? Then there is nothing to prompt the user for.
  const needsInput = queue.filter(e => !e.prompt);
  if (needsInput.length) openEditModal(needsInput[0].id, {isNew:true, queue: needsInput.slice(1).map(e=>e.id)});
}

let lastTool = "";

/* ---------- filtering / rendering ---------- */
function distinctTools(){
  const m = new Map();
  db.entries.forEach(e=>{ if(e.tool) m.set(e.tool,(m.get(e.tool)||0)+1); });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function distinctTags(){
  const m = new Map();
  db.entries.forEach(e=> (e.tags||[]).forEach(t=> m.set(t,(m.get(t)||0)+1)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,24);
}

function filtered(){
  let list = db.entries.slice();
  if (state.tool) list = list.filter(e=>e.tool===state.tool);
  if (state.tag) list = list.filter(e=>(e.tags||[]).includes(state.tag));
  if (state.needOnly) list = list.filter(e=>e.needInfo);
  if (state.search){
    const q = state.search.toLowerCase();
    list = list.filter(e=>
      (e.prompt||"").toLowerCase().includes(q) ||
      (e.negative||"").toLowerCase().includes(q) ||
      (e.tool||"").toLowerCase().includes(q) ||
      (e.model||"").toLowerCase().includes(q) ||
      (e.seed||"").toLowerCase().includes(q) ||
      (e.notes||"").toLowerCase().includes(q) ||
      (e.tags||[]).some(t=>t.toLowerCase().includes(q))
    );
  }
  if (state.sort === "new") list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  else if (state.sort === "old") list.sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));
  else if (state.sort === "fav") list.sort((a,b)=> (b.favorite - a.favorite) || (new Date(b.createdAt)-new Date(a.createdAt)));
  return list;
}

function render(){
  const list = filtered();
  document.getElementById("countLabel").textContent = `${list.length}개`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("emptyState").style.display = db.entries.length ? "none" : "";

  renderChips();

  const frag = document.createDocumentFragment();
  list.forEach(e=>{
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = ()=> openEditModal(e.id);
    const thumbWrap = document.createElement("div");
    thumbWrap.className = "thumb-wrap";
    const img = document.createElement("img");
    img.className = "thumb"; img.loading = "lazy";
    img.src = e.thumb || "";
    thumbWrap.appendChild(img);
    const typeBadge = document.createElement("div");
    typeBadge.className = "badge-type";
    typeBadge.textContent = e.type === "video" ? "▶ 영상" : "🖼 이미지";
    thumbWrap.appendChild(typeBadge);
    if (e.needInfo){
      const nb = document.createElement("div");
      nb.className = "badge-need"; nb.textContent = "정보 필요";
      thumbWrap.appendChild(nb);
    } else if (e.autoMeta){
      const ab = document.createElement("div");
      ab.className = "badge-auto"; ab.textContent = "AUTO";
      thumbWrap.appendChild(ab);
    }
    const favBtn = document.createElement("button");
    favBtn.className = "fav-btn" + (e.favorite?" is-fav":"");
    favBtn.textContent = e.favorite ? "★" : "☆";
    favBtn.onclick = (ev)=>{ ev.stopPropagation(); e.favorite=!e.favorite; saveMeta(); render(); };
    thumbWrap.appendChild(favBtn);
    card.appendChild(thumbWrap);

    const body = document.createElement("div");
    body.className = "card-body";
    const p = document.createElement("div");
    p.className = "card-prompt" + (e.prompt ? "" : " empty");
    p.textContent = e.prompt || "프롬프트가 입력되지 않았어요";
    body.appendChild(p);
    const meta = document.createElement("div");
    meta.className = "card-meta";
    if (e.tool){ const tt = document.createElement("span"); tt.className="tool-tag"; tt.textContent=e.tool; meta.appendChild(tt); }
    const dt = document.createElement("span"); dt.className="date-tag";
    dt.textContent = new Date(e.createdAt).toLocaleDateString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit"});
    meta.appendChild(dt);
    body.appendChild(meta);
    if (e.tags && e.tags.length){
      const tl = document.createElement("div"); tl.className="tag-list";
      e.tags.slice(0,4).forEach(t=>{ const p2=document.createElement("span"); p2.className="tag-pill"; p2.textContent="#"+t; tl.appendChild(p2); });
      body.appendChild(tl);
    }
    card.appendChild(body);
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

function renderChips(){
  const toolBar = document.getElementById("toolChipBar");
  toolBar.innerHTML = "";
  const allChip = mkChip("전체 툴", !state.tool, ()=>{ state.tool=null; render(); });
  toolBar.appendChild(allChip);
  distinctTools().forEach(([name,count])=>{
    toolBar.appendChild(mkChip(`${name}`, state.tool===name, ()=>{ state.tool = state.tool===name?null:name; render(); }, count));
  });
  const needCount = db.entries.filter(e=>e.needInfo).length;
  if (needCount){
    const nc = mkChip("⚠ 정보 필요", state.needOnly, ()=>{ state.needOnly=!state.needOnly; render(); }, needCount);
    toolBar.appendChild(nc);
  }

  const tagBar = document.getElementById("tagChipBar");
  tagBar.innerHTML = "";
  distinctTags().forEach(([name,count])=>{
    tagBar.appendChild(mkChip(`#${name}`, state.tag===name, ()=>{ state.tag = state.tag===name?null:name; render(); }, count));
  });

  const dl = document.getElementById("toolList");
  dl.innerHTML = distinctTools().map(([n])=>`<option value="${escapeHtml(n)}">`).join("");
}
function mkChip(label, active, onClick, count){
  const b = document.createElement("button");
  b.className = "chip" + (active?" active":"");
  b.innerHTML = escapeHtml(label) + (count!=null ? ` <span class="cnt">${count}</span>` : "");
  b.onclick = onClick;
  return b;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const PARAM_LABELS = {steps:"steps", cfg:"cfg", sampler:"sampler", scheduler:"scheduler",
                      denoise:"denoise", size:"size", loras:"LoRA"};
function renderParams(host, entry){
  host.innerHTML = "";
  const p = entry.params;
  if (!p || !Object.keys(p).length) return;
  const box = document.createElement("div");
  box.className = "param-box";
  const head = document.createElement("div");
  head.className = "param-head";
  head.textContent = entry.autoMeta ? "파일에서 자동으로 읽은 값" : "생성 파라미터";
  box.appendChild(head);
  const list = document.createElement("div");
  list.className = "param-list";
  Object.keys(PARAM_LABELS).forEach(k=>{
    if (p[k] == null) return;
    const v = Array.isArray(p[k]) ? p[k].join(", ") : p[k];
    const chip = document.createElement("span");
    chip.className = "param-chip";
    chip.innerHTML = `<b>${escapeHtml(PARAM_LABELS[k])}</b> ${escapeHtml(String(v))}`;
    list.appendChild(chip);
  });
  box.appendChild(list);
  host.appendChild(box);
}

document.getElementById("rescanBtn").onclick = async ()=>{
  const n = await scanOrphans({manual:true});
  if (n) render();
};
document.getElementById("backfillBtn").onclick = backfillMeta;

document.getElementById("searchInput").oninput = (e)=>{ state.search = e.target.value; render(); };
document.getElementById("sortSel").onchange = (e)=>{ state.sort = e.target.value; render(); };

/* ---------- modal ---------- */
let activeModal = null;
async function openEditModal(id, opts){
  opts = opts || {};
  const entry = db.entries.find(x=>x.id===id);
  if (!entry) return;
  const tpl = document.getElementById("modalTpl").content.cloneNode(true);
  const wrap = document.createElement("div");
  wrap.appendChild(tpl);
  document.body.appendChild(wrap);
  activeModal = wrap;

  const mediaPane = wrap.querySelector(".media-pane");
  mediaPane.innerHTML = `<div class="spinner"></div>`;
  try{
    const fh = await rootHandle.getFileHandle(entry.filename);
    const file = await fh.getFile();
    const url = URL.createObjectURL(file);
    modalUrls.push(url);
    mediaPane.innerHTML = "";
    if (entry.type === "video"){
      const v = document.createElement("video"); v.src=url; v.controls=true; v.autoplay=false;
      mediaPane.appendChild(v);
    } else {
      const im = document.createElement("img"); im.src = url;
      mediaPane.appendChild(im);
    }
  }catch(e){ mediaPane.innerHTML = `<div style="color:#999;padding:20px;">파일을 불러올 수 없어요: ${escapeHtml(entry.filename)}</div>`; }

  wrap.querySelector('[data-f="prompt"]').value = entry.prompt || "";
  wrap.querySelector('[data-f="negative"]').value = entry.negative || "";
  wrap.querySelector('[data-f="tool"]').value = entry.tool || "";
  wrap.querySelector('[data-f="seed"]').value = entry.seed || "";
  wrap.querySelector('[data-f="model"]').value = entry.model || "";
  wrap.querySelector('[data-f="tagsRaw"]').value = (entry.tags||[]).join(", ");
  wrap.querySelector('[data-f="notes"]').value = entry.notes || "";
  wrap.querySelector("[data-fn]").textContent = entry.filename;
  renderParams(wrap.querySelector("[data-params]"), entry);
  const favBtn = wrap.querySelector("[data-fav]");
  const syncFav = ()=>{ favBtn.textContent = entry.favorite ? "★" : "☆"; favBtn.style.color = entry.favorite ? "var(--accent)" : ""; };
  syncFav();
  favBtn.onclick = ()=>{ entry.favorite = !entry.favorite; syncFav(); };

  function closeModal(){
    wrap.remove(); activeModal = null;
    // Without this the full-resolution file stays resident for the tab's life.
    modalUrls.splice(0).forEach(u => URL.revokeObjectURL(u));
    document.removeEventListener("keydown", escHandler);
  }
  function escHandler(ev){ if (ev.key === "Escape") closeModal(); }
  document.addEventListener("keydown", escHandler);
  wrap.querySelector(".scrim").onclick = closeModal;
  wrap.querySelector("[data-close]").onclick = closeModal;

  wrap.querySelector("[data-copy]").onclick = ()=>{
    navigator.clipboard.writeText(wrap.querySelector('[data-f="prompt"]').value || "");
    toast("프롬프트를 복사했어요.");
  };

  wrap.querySelector("[data-delete]").onclick = async ()=>{
    if (!confirm("이 항목을 목록에서 삭제할까요? (원본 파일도 함께 삭제됩니다)")) return;
    try{ await rootHandle.removeEntry(entry.filename); }catch(e){}
    db.entries = db.entries.filter(x=>x.id!==entry.id);
    await saveMeta();
    closeModal();
    render();
    toast("삭제했어요.");
  };

  async function doSave(){
    entry.prompt = wrap.querySelector('[data-f="prompt"]').value.trim();
    entry.negative = wrap.querySelector('[data-f="negative"]').value.trim();
    entry.tool = wrap.querySelector('[data-f="tool"]').value.trim();
    entry.seed = wrap.querySelector('[data-f="seed"]').value.trim();
    entry.model = wrap.querySelector('[data-f="model"]').value.trim();
    entry.notes = wrap.querySelector('[data-f="notes"]').value.trim();
    entry.tags = wrap.querySelector('[data-f="tagsRaw"]').value.split(",").map(s=>s.trim()).filter(Boolean);
    entry.needInfo = !entry.prompt;
    if (entry.tool) lastTool = entry.tool;
    await saveMeta();
    render();
  }
  wrap.querySelector("[data-save]").onclick = async ()=>{
    await doSave();
    closeModal();
    if (opts.queue && opts.queue.length){
      openEditModal(opts.queue[0], {isNew:true, queue: opts.queue.slice(1)});
    } else {
      toast("저장했어요.");
    }
  };
}

/* ---------- add button / dnd / paste ---------- */
document.getElementById("addBtn").onclick = ()=>{
  const input = document.createElement("input");
  input.type = "file"; input.multiple = true; input.accept = "image/*,video/*";
  input.onchange = ()=> addFiles(input.files);
  input.click();
};

let dragCounter = 0;
window.addEventListener("dragenter", (e)=>{
  if (document.getElementById("appView").style.display === "none") return;
  dragCounter++;
  document.getElementById("dropzone").classList.add("active");
});
window.addEventListener("dragleave", (e)=>{
  dragCounter--;
  if (dragCounter <= 0){ document.getElementById("dropzone").classList.remove("active"); dragCounter = 0; }
});
window.addEventListener("dragover", (e)=> e.preventDefault());
window.addEventListener("drop", (e)=>{
  e.preventDefault();
  dragCounter = 0;
  document.getElementById("dropzone").classList.remove("active");
  if (document.getElementById("appView").style.display === "none") return;
  if (e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

document.addEventListener("keydown", (e)=>{
  if (e.key === "/" && !activeModal && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA"){
    e.preventDefault();
    document.getElementById("searchInput").focus();
  }
});

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = t === "light" ? "☀️" : "🌙";
  localStorage.setItem("pl-theme", t);
}
document.getElementById("themeBtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "light" ? "dark" : "light");
};

/* ---------- export ---------- */
document.getElementById("exportBtn").onclick = async ()=>{
  const list = filtered();
  if (!list.length){ toast("내보낼 항목이 없어요."); return; }
  const includeFull = confirm(`${list.length}개 항목을 내보냅니다.\n원본 파일까지 포함할까요? (용량이 커질 수 있어요)\n\n확인 = 원본 포함 / 취소 = 썸네일만`);
  toast("내보내는 중...");
  const items = [];
  for (const e of list){
    let mediaSrc = e.thumb;
    let isFull = false;
    if (includeFull){
      try{
        const fh = await rootHandle.getFileHandle(e.filename);
        const file = await fh.getFile();
        if (file.size < 20*1024*1024){
          mediaSrc = await new Promise((res,rej)=>{
            const r = new FileReader();
            r.onload = ()=>res(r.result); r.onerror=rej;
            r.readAsDataURL(file);
          });
          isFull = true;
        }
      }catch(err){}
    }
    items.push({e, mediaSrc, isFull});
  }
  const html = buildExportHtml(items);
  const blob = new Blob([html], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `prompt-log-export-${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  toast("내보내기 완료!");
};

function buildExportHtml(items){
  const cards = items.map(({e,mediaSrc,isFull})=>{
    const media = e.type === "video"
      ? (isFull ? `<video src="${mediaSrc}" controls style="width:100%;display:block;"></video>` : `<img src="${mediaSrc}" style="width:100%;display:block;">`)
      : `<img src="${mediaSrc}" style="width:100%;display:block;">`;
    const tags = (e.tags||[]).map(t=>`<span class="tag-pill">#${escapeHtml(t)}</span>`).join("");
    return `<div class="card">
      <div class="thumb-wrap">${media}<div class="badge-type">${e.type==='video'?'▶ 영상':'🖼 이미지'}</div></div>
      <div class="card-body">
        <div class="card-prompt">${escapeHtml(e.prompt || "프롬프트 없음")}</div>
        <div class="card-meta">${e.tool?`<span class="tool-tag">${escapeHtml(e.tool)}</span>`:""}<span class="date-tag">${new Date(e.createdAt).toLocaleDateString("ko-KR")}</span></div>
        ${tags?`<div class="tag-list">${tags}</div>`:""}
        ${e.notes?`<div style="margin-top:8px;font-size:12px;color:var(--text-dim);">${escapeHtml(e.notes)}</div>`:""}
      </div>
    </div>`;
  }).join("\n");
  const styleTag = document.querySelector("style").outerHTML;
  return `<!DOCTYPE html><html lang="ko" data-theme="dark"><head><meta charset="UTF-8"><title>Prompt Log Export</title>${styleTag}
  <style>body{padding:20px;} main{padding:20px 0;} header{position:static;background:none;padding:0 0 20px;} .brand h1{font-size:26px;}</style>
  </head><body>
  <header><div class="header-top"><div class="brand"><h1>Prompt Log<span class="dot">.</span></h1></div>
  <span style="color:var(--text-faint);font-size:13px;">${items.length}개 항목 · ${new Date().toLocaleDateString("ko-KR")} 내보냄</span></div></header>
  <main><div class="masonry">${cards}</div></main>
  </body></html>`;
}

boot();
})();
</script>
